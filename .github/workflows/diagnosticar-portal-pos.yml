name: Diagnosticar links do novo portal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnosticar-portal-pos.mjs'
      - '.github/workflows/diagnosticar-portal-pos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Conferir acesso e sitemap sem publicar URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter repositório
        uses: actions/checkout@v5
      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar DNS, URLs do guia e sitemap
        run: node scripts/diagnosticar-portal-pos.mjs
      - name: Arquivar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: f4-4-diagnostico-portal
          path: link-audit-results/diagnostico.json
          retention-days: 14
