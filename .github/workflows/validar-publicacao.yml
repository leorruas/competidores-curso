name: Validar publicação de cursos
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - '.github/workflows/validar-publicacao.yml'
      - '.github/workflows/qa-visual.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - '.github/workflows/validar-publicacao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-conteudo-publico:
    name: Validar conteúdo público e fronteira editorial
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v5
      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar catálogo aprovado
        run: node scripts/validar-publicacao.mjs
      - name: Verificar sintaxe da aplicação e do validador
        run: |
          node --check app.js
          node --check scripts/validar-publicacao.mjs
          node --check scripts/validar-estrutura.mjs
      - name: Executar todos os testes do guia e do validador
        run: node --test tests/*.mjs

  qa-visual:
    name: Conferir todos os cursos em três larguras
    needs: validar-conteudo-publico
    uses: ./.github/workflows/qa-visual.yml
    permissions:
      contents: read

  publicar-pages:
    name: Publicar Pages somente depois do conteúdo e QA aprovados
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.IFMG_PAGES_ACTIONS == 'true' }}
    needs: [validar-conteudo-publico, qa-visual]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o commit validado
        uses: actions/checkout@v5
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar o guia
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar a mesma revisão aprovada
        id: deployment
        uses: actions/deploy-pages@v4
